<!doctype html>
<html lang="ht">
<head>
<meta charset="utf-8" />
<title>GovApp — design preview</title>
<!--
  A browser reproduction of GovApp's screens, used to produce the images in the
  README. It is NOT the app: it is a rendering of the same design tokens,
  because an iOS app cannot be built or run on Linux.

  Every value below is copied from GovApp/DesignSystem/Theme.swift and the mark
  geometry from AyitiGeometry. The onboarding photographs are loaded straight
  out of the asset catalog, so they cannot drift. If you change a token in
  Swift, change it here too or the README images stop telling the truth.
-->
<style>
  :root {
    /* ayiti.io house palette — must match Brand in Theme.swift. */
    --blue: #1E56C8;
    --red: #E63946;
    --ink: #0D1B2A;
    --surface: #F3F5F7;
    --ink-muted: #6B7280;
    --action: var(--blue);
    --background: #FFFFFF;
    /* Derived: the palette specifies no hairline or placeholder colour. */
    --line: rgba(107, 114, 128, .20);
    --placeholder: rgba(107, 114, 128, .80);
    --on-photo: #FFFFFF;

    --gutter: 24px;
    --field-height: 56px;
    --radius: 12px;
    --stack: 12px;
    --section: 28px;
    --bubble-radius: 20px;
    --card-radius: 24px;
    --chip-height: 38px;
    --control-button: 44px;
    --progress-track: 3px;
    --bar-height: 76px;
    --pill-height: 52px;

    --safe-top: 59px;
    --safe-bottom: 34px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #fff;
    font-family: Inter, -apple-system, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    gap: 48px;
    padding: 48px;
  }

  .device {
    width: 393px;
    height: 852px;
    background: var(--background);
    color: var(--ink);
    position: relative;
    overflow: hidden;
    flex: none;
  }

  .screen {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    padding: var(--safe-top) var(--gutter) var(--safe-bottom);
  }
  .screen.active { display: flex; }

  .spacer { flex: 1 1 auto; }

  /* ---- ayiti.io lockup ---------------------------------------------- */
  .lockup { display: flex; align-items: center; gap: 7.5px; }
  .lockup .wordmark {
    font-size: 30px;
    font-weight: 900;
    letter-spacing: -1px;
    color: var(--ink);
    line-height: 1;
  }
  .lockup.on-photo .wordmark {
    color: var(--on-photo);
    text-shadow: 0 2px 8px rgba(0, 0, 0, .35);
  }

  /* ---- shared controls ----------------------------------------------- */
  .field {
    height: var(--field-height);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 0 16px;
    display: flex;
    align-items: center;
    font-size: 17px;
    color: var(--ink);
  }
  .field.empty { color: var(--placeholder); }

  .btn {
    background: var(--action);
    color: #fff;
    border-radius: var(--radius);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: none;
    font-family: inherit;
    height: var(--field-height);
    padding: 0 40px;
    font-size: 17px;
    font-weight: 600;
    align-self: flex-start;
    cursor: pointer;
  }
  .btn[disabled] { opacity: .45; }

  .avatar {
    background: var(--surface);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-muted);
    font-weight: 600;
    flex: none;
  }

  .footer-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
  }
  .footer-row .label { color: var(--ink-muted); }
  .footer-row .value { font-variant-numeric: tabular-nums; }

  /* ---- onboarding ----------------------------------------------------- */
  .screen.onboarding { padding: 0; }
  .photo {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
  }
  /* Mirrors Brand.photoScrim: ink-tinted, y .32 -> bottom, 0 / .35 / .85 */
  .scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(13, 27, 42, 0) 32%,
      rgba(13, 27, 42, .35) 62.6%,
      rgba(13, 27, 42, .85) 100%
    );
  }
  .onboarding .content {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: calc(var(--safe-top) + var(--stack)) var(--gutter)
             calc(var(--safe-bottom) + var(--stack));
  }
  .progress { display: flex; gap: 6px; }
  .progress i {
    flex: 1;
    height: var(--progress-track);
    border-radius: 2px;
    background: rgba(255, 255, 255, .35);
    box-shadow: 0 1px 4px rgba(0, 0, 0, .25);
  }
  .progress i.on { background: var(--on-photo); }
  .onboarding .lockup { margin-top: 18px; }
  .headline {
    font-size: 36px;
    font-weight: 700;
    line-height: 1.08;
    color: var(--on-photo);
    /* Mirrors the two .shadow passes on the Swift headline. */
    text-shadow: 0 2px 6px rgba(0, 0, 0, .50), 0 6px 18px rgba(0, 0, 0, .35);
    margin-bottom: 18px;
  }
  .action-bar {
    height: var(--bar-height);
    border-radius: calc(var(--bar-height) / 2);
    background: rgba(255, 255, 255, .18);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, .25);
    display: flex;
    align-items: center;
    gap: var(--stack);
    padding-left: var(--stack);
    padding-right: calc(var(--stack) * 2);
    flex: none;
  }
  .action-bar.solo { padding-right: var(--stack); }
  .action-bar.solo .pill { flex: 1; }
  .pill {
    height: var(--pill-height);
    padding: 0 28px;
    border: none;
    border-radius: calc(var(--pill-height) / 2);
    background: var(--ink);
    color: var(--on-photo);
    font-family: inherit;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
  }
  .hint {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--on-photo);
    font-size: 17px;
  }
  .hint .who { display: flex; align-items: center; gap: 8px; }

  /* ---- sign in --------------------------------------------------------- */
  .signin-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 8px;
  }
  .close { color: var(--ink-muted); font-size: 15px; font-weight: 600; }
  .title { font-size: 28px; font-weight: 700; margin-top: var(--section); line-height: 1.15; }
  .fields { margin-top: var(--section); display: flex; flex-direction: column; gap: var(--stack); }
  .signin-submit { margin-top: var(--section); }
  .signin-footer { display: flex; flex-direction: column; gap: 6px; padding-bottom: var(--stack); }
  .copyright { display: flex; align-items: center; gap: 6px; padding-top: 4px; font-size: 13px; color: var(--ink-muted); }
  .repiblik { display: flex; align-items: center; gap: 2.7px; font-size: 15px; font-weight: 700; color: var(--ink); }
  .flag { width: 12.3px; height: 12.3px; border-radius: 1px; overflow: hidden; display: flex; flex-direction: column; }
  .flag i { flex: 1; display: block; }
  .flag i:first-child { background: var(--blue); }
  .flag i:last-child { background: var(--red); }

  /* ---- chat ------------------------------------------------------------ */
  .chat-header {
    display: flex;
    align-items: center;
    gap: var(--stack);
    padding-top: 8px;
    padding-bottom: var(--stack);
  }
  .chat-header .grow { flex: 1; }
  .circle-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--surface);
    color: var(--ink-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }

  .empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .empty .greeting {
    font-size: 28px;
    font-weight: 700;
    line-height: 1.15;
    text-align: center;
    margin-top: var(--section);
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: var(--section);
  }
  .chip {
    height: var(--chip-height);
    padding: 0 14px;
    border: 1px solid var(--line);
    border-radius: calc(var(--chip-height) / 2);
    background: var(--background);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 15px;
    font-weight: 500;
    color: var(--ink);
  }
  .chip .ic { color: var(--action); display: flex; }

  .transcript {
    flex: 1 1 auto;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: var(--section);
    padding: var(--stack) 0;
  }
  .bubble {
    max-width: calc(100% - 44px);
    margin-left: auto;
    background: var(--surface);
    border-radius: var(--bubble-radius);
    padding: 12px 16px;
    font-size: 17px;
    line-height: 1.3;
  }
  .answer-head {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 15px;
    font-weight: 600;
  }
  .answer-text {
    font-size: 17px;
    line-height: 1.35;
    margin-top: var(--stack);
    white-space: pre-wrap;
  }
  .answer-text strong { font-weight: 600; }
  .answer-text code {
    font-family: ui-monospace, monospace;
    font-size: 15px;
    background: var(--surface);
    border-radius: 4px;
    padding: 1px 4px;
  }
  .actions { display: flex; gap: 8px; margin-top: var(--stack); }
  .pill-thinking {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: var(--chip-height);
    padding: 0 14px;
    border-radius: calc(var(--chip-height) / 2);
    background: var(--surface);
    font-size: 15px;
    font-weight: 500;
    /* ink, not ink-muted: 15pt medium is not large text and ink-muted on
       surface is 4.42:1, just short of 4.5:1. */
    color: var(--ink);
    align-self: flex-start;
  }

  .composer-card {
    border: 1px solid var(--line);
    border-radius: var(--card-radius);
    padding: 14px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, .05);
    margin-bottom: var(--stack);
    flex: none;
  }
  .composer-row { display: flex; align-items: flex-end; gap: var(--stack); }
  .composer-row .draft { flex: 1; font-size: 17px; color: var(--ink); line-height: 1.3; }
  .composer-row .draft.empty { color: var(--placeholder); }
  .send-circle {
    width: var(--control-button);
    height: var(--control-button);
    border-radius: 50%;
    background: var(--action);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }
  .send-circle.off { opacity: .4; }
  .model-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: var(--stack);
    font-size: 10px;
    font-weight: 600;
    color: var(--ink-muted);
  }
  .model-row .grow { flex: 1; }

  /* ---- palette sheet (README asset, not an app screen) ----------------- */
  .palette {
    display: none;
    width: 680px;
    background: var(--background);
    padding: 32px 36px;
  }
  .palette.active { display: block; }
  .palette h2 {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--ink);
    margin-bottom: 24px;
  }
  .swatch {
    display: flex;
    align-items: center;
    gap: 28px;
    padding: 14px 0;
  }
  .swatch .chipblock {
    width: 148px;
    height: 76px;
    border-radius: 6px;
    flex: none;
    border: 1px solid rgba(107, 114, 128, .18);
  }
  .swatch .meta { font-size: 14px; line-height: 1.55; color: var(--ink); }
  .swatch .name { font-weight: 700; }
  .swatch .role { color: var(--ink-muted); }
</style>
</head>
<body>

<template id="mark">
  <svg viewBox="190 195 648 610" xmlns="http://www.w3.org/2000/svg">
    <polygon points="435,195 555,195 660,355 190,805" fill="#1E56C8"/>
    <path fill-rule="evenodd" fill="#E63946"
      d="M678,408 L448,652 L562,656 L648,805 L838,805 Z
         M654,735 a62,62 0 1,0 124,0 a62,62 0 1,0 -124,0 Z"/>
  </svg>
</template>

<div class="device" id="device"></div>
<div class="palette" id="palette"></div>

<script type="module">
const L10n = {
  // Onboarding — must match L10n.Onboarding in Swift.
  slides: [
    'Poze yo kesyon',
    'Pale ak gouvènman Ayiti\u00A0a',
    'Mande tout enfòmasyon oswa dokiman ou bezwen',
  ],
  advance: 'Kontinye',
  slideHint: 'Glise',

  title: 'Bonjou, konekte isit la',
  hid: 'Idantite Ayiti (HID)',
  pin: 'Kòd sekrè (Pin)',
  submit: 'Konekte',
  working: 'N ap verifye…',
  sessionID: 'Session ID:',
  expiresIn: 'Expires in:',
  copyright: '© 2026 ayiti.io from',

  // Chat — must match L10n.Chat and ChatSuggestion.all in Swift.
  assistant: 'GOVTalk AI',
  answer: 'Repons',
  composer: 'Mande m nenpòt bagay…',
  thinking: 'GOVTalk ap reflechi…',
  copy: 'Kopye',
  retry: 'Reeseye',
  share: 'Pataje',
  greeting: (name) =>
    name ? `Bonjou ${name}, kijan m ka ede w jodi a?` : 'Bonjou! Kijan m ka ede w jodi a?',
  model: (name) => `GOVTalk · ${name}`,
  suggestions: [
    { label: 'Paspò', icon: 'airplane' },
    { label: 'Kat idantite', icon: 'idCard' },
    { label: 'Batistè', icon: 'doc' },
    { label: 'Taks', icon: 'percent' },
    { label: 'Jwenn yon biwo', icon: 'mappin' },
  ],
};

// Stand-ins for the SF Symbols the app uses; SF Pro is not available here.
const ICONS = {
  airplane: '<path d="M21 3 3 10.5l7.5 3L13.5 21 21 3z"/>',
  idCard: '<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><circle cx="8" cy="11" r="2"/>'
    + '<path d="M5 16.5c.8-1.5 4.2-1.5 5 0"/><path d="M14.5 10.5h4M14.5 14h4"/>',
  doc: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/>'
    + '<path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/>',
  percent: '<circle cx="7.5" cy="7.5" r="2.5"/><circle cx="16.5" cy="16.5" r="2.5"/><path d="M19 5 5 19"/>',
  mappin: '<path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/>',
  retry: '<path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/>',
  share: '<path d="M12 16V4"/><path d="m8 8 4-4 4 4"/><path d="M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/>',
  arrowUp: '<path d="M12 19V5"/><path d="m6 11 6-6 6 6"/>',
  stop: '<rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor" stroke="none"/>',
  newChat: '<path d="M12 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/>'
    + '<path d="M18.5 3.5a2.1 2.1 0 0 1 3 3L13 15l-4 1 1-4z"/>',
};

const icon = (name, size = 15) =>
  `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
     stroke-linejoin="round">${ICONS[name] ?? ''}</svg>`;

// Straight out of the asset catalog so the preview cannot drift from the app.
const PHOTOS = [
  'OnboardingStreet',
  'OnboardingTown',
  'OnboardingAvenue',
].map((n) => `../../GovApp/Assets.xcassets/Onboarding/${n}.imageset/${n}.jpg`);

export const state = {
  screen: 'onboarding',
  slide: 0,
  username: 'Jean Baptiste',
  govURLID: 'gov.ayiti.io/jbaptiste',
  aiModel: 'ellofive',
  showProfileOnLastSlide: false,
  hid: '',
  pin: '',
  working: false,
  grantMask: '***764d77',
  countdown: '29:50',
  messages: [],
  draft: '',
  replying: false,
};

const mark = (size) => {
  const svg = document.getElementById('mark').content.firstElementChild.cloneNode(true);
  svg.setAttribute('height', size);
  svg.setAttribute('width', size * (648 / 610));
  return svg.outerHTML;
};

const lockup = (onPhoto = false) =>
  `<div class="lockup${onPhoto ? ' on-photo' : ''}">${mark(34)}<span class="wordmark">ayiti.io</span></div>`;
const avatar = (size, initial) =>
  `<div class="avatar" style="width:${size}px;height:${size}px;font-size:${size * 0.42}px">${initial ?? ''}</div>`;
const initial = () => (state.username ? state.username[0].toUpperCase() : '');
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
// Mirrors AttributedString(markdown:.inlineOnlyPreservingWhitespace): inline
// emphasis renders, block structure such as list dashes stays literal.
const inlineMarkdown = (s) => esc(s)
  .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
  .replace(/`([^`]+)`/g, '<code>$1</code>');

function onboarding() {
  const last = state.slide === L10n.slides.length - 1;
  const dots = L10n.slides
    .map((_, i) => `<i class="${i === state.slide ? 'on' : ''}"></i>`)
    .join('');

  const trailing = !last
    ? `<span class="hint">${L10n.slideHint} <span>&#8594;</span></span>`
    : state.showProfileOnLastSlide
      ? `<span class="hint"><span class="who">${esc(state.username)}${avatar(36, initial())}</span></span>`
      : '';
  // With nothing to its right, the pill fills the bar instead of leaving a gap.
  const solo = trailing === '' ? ' solo' : '';

  return `
  <section class="screen onboarding active">
    <div class="photo" style="background-image:url('${PHOTOS[state.slide]}')"></div>
    <div class="scrim"></div>
    <div class="content">
      <div class="progress">${dots}</div>
      ${lockup(true)}
      <div class="spacer"></div>
      <h1 class="headline">${esc(L10n.slides[state.slide])}</h1>
      <div class="action-bar${solo}">
        <button class="pill">${L10n.advance}</button>
        ${trailing}
      </div>
    </div>
  </section>`;
}

function signin() {
  const canSubmit = state.hid.trim() && state.pin && !state.working;
  return `
  <section class="screen active">
    <div class="signin-header">${lockup()}<span class="close">&#10005;</span></div>
    <h1 class="title">${L10n.title}</h1>
    <div class="fields">
      <div class="field ${state.hid ? '' : 'empty'}">${esc(state.hid || L10n.hid)}</div>
      <div class="field ${state.pin ? '' : 'empty'}">${state.pin ? '•'.repeat(state.pin.length) : L10n.pin}</div>
    </div>
    <div class="signin-submit">
      <button class="btn" ${canSubmit ? '' : 'disabled'}>
        ${state.working ? L10n.working : L10n.submit}
      </button>
    </div>
    <div class="spacer"></div>
    <div class="signin-footer">
      <div class="footer-row">
        <span class="label">${L10n.sessionID}</span>
        <span class="value" style="color:var(--action)">${state.grantMask}</span>
      </div>
      <div class="footer-row">
        <span class="label">${L10n.expiresIn}</span>
        <span class="value">${state.countdown}</span>
      </div>
      <div class="copyright">
        <span>${L10n.copyright}</span>
        <span class="repiblik">Repiblik<span class="flag"><i></i><i></i></span>Ayiti</span>
      </div>
    </div>
  </section>`;
}

function chat() {
  const empty = state.messages.length === 0;

  const chips = L10n.suggestions
    .map((s) => `<span class="chip"><span class="ic">${icon(s.icon)}</span>${esc(s.label)}</span>`)
    .join('');

  const body = empty
    ? `<div class="empty">
         ${mark(64)}
         <div class="greeting">${esc(L10n.greeting(state.username))}</div>
         <div class="chips">${chips}</div>
       </div>`
    : `<div class="transcript">
         ${state.messages.map(messageRow).join('')}
         ${state.replying
           ? `<div class="pill-thinking">${mark(14)}${L10n.thinking}</div>`
           : ''}
       </div>`;

  return `
  <section class="screen active">
    <div class="chat-header">
      ${lockup()}
      <span class="grow"></span>
      ${empty ? '' : `<span class="circle-btn">${icon('newChat', 18)}</span>`}
      ${avatar(38, initial())}
    </div>
    ${body}
    <div class="composer-card">
      <div class="composer-row">
        <span class="draft ${state.draft ? '' : 'empty'}">${esc(state.draft || L10n.composer)}</span>
        <span class="send-circle ${state.draft && !state.replying ? '' : 'off'}">
          ${state.replying ? icon('stop', 20) : icon('arrowUp', 20)}
        </span>
      </div>
      <div class="model-row">
        ${mark(12)}<span>${esc(L10n.model(state.aiModel))}</span>
        <span class="grow"></span>
        <span>${esc(state.govURLID)}</span>
      </div>
    </div>
  </section>`;
}

function messageRow(m) {
  if (m.author === 'citizen') {
    return `<div class="bubble">${esc(m.text)}</div>`;
  }
  const actions = [
    ['copy', L10n.copy],
    ['retry', L10n.retry],
    ['share', L10n.share],
  ].map(([ic, label]) =>
    `<span class="chip"><span class="ic">${icon(ic)}</span>${label}</span>`).join('');

  return `
    <div>
      <div class="answer-head">${mark(15)}${L10n.answer}</div>
      <div class="answer-text">${inlineMarkdown(m.text)}</div>
      <div class="actions">${actions}</div>
    </div>`;
}

/**
 * The house palette sheet used by the README. Values are read back out of the
 * stylesheet, so this cannot disagree with what the screens above render.
 */
const PALETTE = [
  ['blue', '--blue', '85, 60, 0, 0', 'Logo left stroke, primary actions'],
  ['red', '--red', '0, 90, 70, 0', 'Logo right stroke, errors'],
  ['ink', '--ink', '100, 85, 45, 70', 'Headings, body text, dark surfaces'],
  ['surface', '--surface', '4, 2, 1, 0', 'Cards, bubbles, avatars'],
  ['inkMuted', '--ink-muted', '60, 47, 35, 1', 'Secondary text and captions'],
];

function palette() {
  const styles = getComputedStyle(document.documentElement);
  const rows = PALETTE.map(([name, variable, cmyk, role]) => {
    const hex = styles.getPropertyValue(variable).trim().toUpperCase();
    const rgb = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16)).join(', ');
    return `
      <div class="swatch">
        <div class="chipblock" style="background:${hex}"></div>
        <div class="meta">
          <div class="name">${hex}&nbsp; · &nbsp;Brand.${name}</div>
          <div>RGB ${rgb}</div>
          <div>CMYK ${cmyk}</div>
          <div class="role">${role}</div>
        </div>
      </div>`;
  }).join('');
  return `<h2>Kleurenpallet · ayiti.io</h2>${rows}`;
}

export function render() {
  const device = document.getElementById('device');
  const sheet = document.getElementById('palette');

  if (state.screen === 'palette') {
    device.style.display = 'none';
    sheet.classList.add('active');
    sheet.innerHTML = palette();
    return;
  }

  device.style.display = '';
  sheet.classList.remove('active');
  const screens = { onboarding, signin, chat };
  device.innerHTML = screens[state.screen]();
}

window.GovAppPreview = { state, render, photos: PHOTOS };

const params = new URLSearchParams(location.search);
if (params.get('screen')) state.screen = params.get('screen');
if (params.get('slide')) state.slide = Number(params.get('slide'));

render();
</script>
